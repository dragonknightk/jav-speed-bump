<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>色情减速带 · JAV Speed Bump</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="gate.css">
</head>
<body>
<div class="stripe"></div>
<div class="toast-wrap" id="toast" aria-live="polite"></div>
<div class="wrap wide">
  <header class="top-bar">
    <div class="brand-group">
      <h1 id="headline">🚧 色情减速带</h1>
      <div class="target-banner" id="sub"></div>
    </div>
    <div class="row">
      <button class="small" id="langBtn" title="切换语言 / Switch Language">EN</button>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="steps" id="steps"></div>
      <div id="notice"></div>
      <div class="panel puzzle-panel">
        <div class="puzzle-hd">
          <h2 id="ptitle"></h2>
          <span class="tag amber" id="plevel"></span>
        </div>
        <div class="intro-box" id="pintro"></div>
        <div id="stage"></div>
      </div>
    </main>

    <aside>
      <div class="panel urge" id="urge">
        <div class="urge-hd">
          <span class="urge-title" id="urgeTitle">冲动消退曲线</span>
          <span class="urge-badge"><em id="urgePhase"></em></span>
        </div>
        <div id="urgeSvg"></div>
        <div class="urge-lb">
          <span id="urgeStart">0 分钟</span>
          <span class="pk" id="urgePeak">浪峰</span>
          <span id="urgeEnd">15 分钟</span>
        </div>
      </div>

      <div class="panel rules-card" id="rulesCard"></div>
    </aside>
  </div>
</div>
<script type="module" src="gate.js"></script>
</body>
</html>
